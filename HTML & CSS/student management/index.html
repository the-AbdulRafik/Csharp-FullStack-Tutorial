<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
</head>
<body>
    <div>
        <div><h1>Student Management</h1></div>
        <section id="main">
            <button onclick="getStudents()">View Students</button>
        </section>

        <section id="addStudent">
            <h2>Add Student</h2>
            <form id="addStudentForm" onsubmit="addStudent(event)">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required><br><br>
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" required><br><br>
                <label for="grade">Grade:</label>
                <input type="text" id="grade" name="grade" required><br><br>
                <input type="submit" value="Add Student">
            </form>
        </section>

        <section id="viewStudents">
            <h2>View Students</h2>
            <table id="studentTable" border="1">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Grade</th>
                    </tr>
                </thead>
                <tbody id="studentList">
                    <!-- Student data will be populated here -->
                </tbody>
            </table>
        </section>
        <section id="deleteStudent">
            <h2>Delete Student</h2>
            <form id="deleteStudentForm">
                <label for="deleteName">Name:</label>
                <input type="text" id="deleteName" name="deleteName" required><br><br>
                <input type="submit" value="Delete Student">
            </form>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
